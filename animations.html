<script>
// Canvas animations for slide 9 (photon random walk out of the Sun) and
// slide 20 (a dependency network that keeps growing). Each scene starts when
// its slide becomes current and stops when the deck moves on, so it replays on
// every visit and stays in step with the CSS-timed effects.
(function () {
  'use strict';

  var TAU = Math.PI * 2;
  var AMBER = '#ffb638';
  var GREEN = '#09e57b';
  var FAMILY_COLORS = ['#4a7fd8', '#e07040', '#5bb58a', '#e3a83a', '#e088a8', '#4f9a35', '#7a6ad6', '#e0595a'];

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // Match the canvas backing store to Reveal's scale and the screen density
  function fitCanvas(canvas, w, h) {
    var s = (Reveal.getScale ? Reveal.getScale() : 1) * (window.devicePixelRatio || 1);
    canvas.width = Math.round(w * s);
    canvas.height = Math.round(h * s);
    var ctx = canvas.getContext('2d');
    ctx.setTransform(s, 0, 0, s, 0, 0);
    return ctx;
  }

  function glow(ctx, x, y, r, rgb, alpha) {
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(' + rgb + ',' + alpha + ')');
    g.addColorStop(1, 'rgba(' + rgb + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }

  // ---------------------------------------------------------------------------
  // Slide 9: a photon random-walks from the core to the surface
  // ---------------------------------------------------------------------------
  function sunWalk(slide) {
    var canvas = slide.querySelector('canvas.sun-walk');
    var counter = slide.querySelector('.years-count');
    var SIZE = 860, C = SIZE / 2, R = 380;
    var START = 600, END = 12400;   // ms after the slide appears
    var YEARS = 40000;

    // Unbiased walk on the unit disk. The fixed seed gives ~2,250 steps and an
    // exit toward the right, where the next slide picks up the trip to Earth.
    var rng = mulberry32(919), step = 1 / 40, x = 0, y = 0, pts = [0, 0];
    while (x * x + y * y < 1 && pts.length < 40000) {
      var a = rng() * TAU;
      x += step * Math.cos(a);
      y += step * Math.sin(a);
      pts.push(x, y);
    }
    var d = Math.hypot(x, y);
    var exitX = x / d, exitY = y / d;
    pts[pts.length - 2] = exitX;
    pts[pts.length - 1] = exitY;
    var nSteps = pts.length / 2 - 1;

    var ctx, raf = 0, t0 = 0;

    function drawSun() {
      glow(ctx, C, C, R * 1.12, '255,182,56', 0.28);

      var body = ctx.createRadialGradient(C, C, 0, C, C, R);
      body.addColorStop(0, 'rgba(255,214,120,0.55)');
      body.addColorStop(0.25, 'rgba(255,182,56,0.38)');
      body.addColorStop(0.7, 'rgba(240,122,31,0.28)');
      body.addColorStop(1, 'rgba(232,85,28,0.42)');
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.arc(C, C, R, 0, TAU);
      ctx.fill();

      ctx.setLineDash([6, 8]);
      ctx.strokeStyle = 'rgba(255,230,180,0.35)';
      ctx.lineWidth = 1.5;
      [0.25, 0.7].forEach(function (f) {
        ctx.beginPath();
        ctx.arc(C, C, R * f, 0, TAU);
        ctx.stroke();
      });
      ctx.setLineDash([]);

      ctx.strokeStyle = AMBER;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(C, C, R, 0, TAU);
      ctx.stroke();
    }

    function drawLabels() {
      ctx.font = '700 20px "Sulphur Point", sans-serif';
      ctx.textAlign = 'center';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(10,10,10,0.55)';
      ctx.fillStyle = 'rgba(255,240,210,0.9)';
      [['core · fusion', 0.16], ['radiative zone', 0.5], ['convective zone', 0.86]].forEach(function (l) {
        ctx.strokeText(l[0], C, C + R * l[1]);
        ctx.fillText(l[0], C, C + R * l[1]);
      });
    }

    function frame(now) {
      var t = now - t0;
      var p = Math.min(1, Math.max(0, (t - START) / (END - START)));
      var k = Math.floor(p * nSteps);

      ctx.clearRect(0, 0, SIZE, SIZE);
      drawSun();

      // Fusion flicker at the core before the walk begins
      if (t < START + 1200) glow(ctx, C, C, 40, '255,246,216', 0.9 * (1 - Math.max(0, t - START) / 1200));

      ctx.beginPath();
      ctx.moveTo(C, C);
      for (var i = 1; i <= k; i++) ctx.lineTo(C + pts[2 * i] * R, C + pts[2 * i + 1] * R);
      ctx.strokeStyle = 'rgba(255,246,216,0.6)';
      ctx.lineWidth = 1.4;
      ctx.lineJoin = 'round';
      ctx.stroke();

      drawLabels();

      var hx = C + pts[2 * k] * R, hy = C + pts[2 * k + 1] * R;
      if (p < 1) {
        glow(ctx, hx, hy, 16, '255,246,216', 0.95);
      } else {
        // Escape: flash at the surface and a ray heading out toward Earth
        var q = Math.min(1, (t - END) / 700);
        glow(ctx, hx, hy, 20 + 40 * q, '255,246,216', 0.9 * (1 - q) + 0.3);
        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.lineTo(hx + exitX * R * 0.2 * q, hy + exitY * R * 0.2 * q);
        ctx.strokeStyle = '#fff6d8';
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      counter.textContent = p < 1
        ? (Math.round(p * YEARS / 1000) * 1000).toLocaleString('en-US')
        : '~' + YEARS / 1000 + 'k';

      raf = t < END + 1000 ? requestAnimationFrame(frame) : 0;
    }

    return {
      start: function () {
        ctx = fitCanvas(canvas, SIZE, SIZE);
        t0 = performance.now();
        counter.textContent = '0';
        raf = requestAnimationFrame(frame);
      },
      stop: function () {
        cancelAnimationFrame(raf);
        raf = 0;
      },
      resize: function () {
        ctx = fitCanvas(canvas, SIZE, SIZE);
        if (!raf) raf = requestAnimationFrame(frame);
      }
    };
  }

  // ---------------------------------------------------------------------------
  // Slide 20: the A-B-C-D dependency graph from slide 13 keeps growing
  // ---------------------------------------------------------------------------
  function growNetwork(slide) {
    var canvas = slide.querySelector('canvas.grow-network');
    var W = 1600, H = 900;
    var FOCUS = { x: 800, y: 370, w: 1440, h: 600 };  // screen region the network fits into
    var MAX_NODES = 260;
    var ctx, raf = 0, t0 = 0, rng, nodes, links, cam, nextSpawn;

    function addNode(x, y, label, color, born) {
      nodes.push({ x: x, y: y, vx: 0, vy: 0, label: label, color: color, deg: 0, born: born });
      return nodes.length - 1;
    }

    function link(a, b) {
      links.push([a, b]);
      nodes[a].deg++;
      nodes[b].deg++;
    }

    function reset(now) {
      rng = mulberry32(20);
      nodes = [];
      links = [];
      addNode(140, 0, 'A', null, now);
      addNode(0, -55, 'B', null, now);
      addNode(0, 60, 'C', null, now);
      addNode(-140, -55, 'D', null, now);
      link(0, 1);
      link(1, 3);
      link(0, 2);
      cam = { x: 0, y: 0, s: 2 };
      nextSpawn = 800;
    }

    function spawn(born) {
      // Preferential attachment: well-connected nodes collect more dependents
      var total = 0, i;
      for (i = 0; i < nodes.length; i++) total += nodes[i].deg + 1;
      var r = rng() * total, parent = 0;
      for (i = 0; i < nodes.length; i++) {
        r -= nodes[i].deg + 1;
        if (r <= 0) { parent = i; break; }
      }
      var p = nodes[parent], a = rng() * TAU;
      var color = FAMILY_COLORS[Math.floor(rng() * FAMILY_COLORS.length)];
      var n = addNode(p.x + Math.cos(a) * 40, p.y + Math.sin(a) * 40, null, color, born);
      link(parent, n);

      // Sometimes also depend on the nearest other node, which turns the tree into a web
      if (nodes.length > 8 && rng() < 0.3) {
        var best = -1, bestD = Infinity;
        for (i = 0; i < n; i++) {
          if (i === parent) continue;
          var dx = nodes[i].x - nodes[n].x, dy = nodes[i].y - nodes[n].y, dd = dx * dx + dy * dy;
          if (dd < bestD) { bestD = dd; best = i; }
        }
        if (best >= 0) link(n, best);
      }
    }

    function tick() {
      var n = nodes.length, i, j, a, b, dx, dy, d2, d, f;
      for (i = 0; i < n; i++) {
        a = nodes[i];
        for (j = i + 1; j < n; j++) {
          b = nodes[j];
          dx = b.x - a.x; dy = b.y - a.y;
          d2 = dx * dx + dy * dy + 0.01;
          if (d2 > 90000) continue;
          d = Math.sqrt(d2);
          f = 2400 / d2;
          a.vx -= dx / d * f; a.vy -= dy / d * f;
          b.vx += dx / d * f; b.vy += dy / d * f;
        }
      }
      for (i = 0; i < links.length; i++) {
        a = nodes[links[i][0]]; b = nodes[links[i][1]];
        dx = b.x - a.x; dy = b.y - a.y;
        d = Math.sqrt(dx * dx + dy * dy) || 1;
        f = (d - 48) * 0.04;
        a.vx += dx / d * f; a.vy += dy / d * f;
        b.vx -= dx / d * f; b.vy -= dy / d * f;
      }
      for (i = 0; i < n; i++) {
        a = nodes[i];
        a.vx = (a.vx - a.x * 0.0015) * 0.82;
        a.vy = (a.vy - a.y * 0.0015) * 0.82;
        a.x += Math.max(-8, Math.min(8, a.vx));
        a.y += Math.max(-8, Math.min(8, a.vy));
      }
    }

    function updateCamera() {
      var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      nodes.forEach(function (nd) {
        if (nd.x < minX) minX = nd.x;
        if (nd.x > maxX) maxX = nd.x;
        if (nd.y < minY) minY = nd.y;
        if (nd.y > maxY) maxY = nd.y;
      });
      var target = Math.min(FOCUS.w / (maxX - minX + 80), FOCUS.h / (maxY - minY + 80), 2);
      cam.s += (target - cam.s) * 0.04;
      cam.x += ((minX + maxX) / 2 - cam.x) * 0.04;
      cam.y += ((minY + maxY) / 2 - cam.y) * 0.04;
    }

    function sx(x) { return FOCUS.x + (x - cam.x) * cam.s; }
    function sy(y) { return FOCUS.y + (y - cam.y) * cam.s; }

    function draw(now) {
      ctx.clearRect(0, 0, W, H);

      ctx.beginPath();
      links.forEach(function (l) {
        ctx.moveTo(sx(nodes[l[0]].x), sy(nodes[l[0]].y));
        ctx.lineTo(sx(nodes[l[1]].x), sy(nodes[l[1]].y));
      });
      ctx.strokeStyle = 'rgba(250,250,250,0.18)';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      var zoom = Math.max(0.6, Math.min(1.4, cam.s));
      nodes.forEach(function (nd) {
        var x = sx(nd.x), y = sy(nd.y), grow = Math.min(1, (now - nd.born) / 450), r;
        if (nd.label) {
          r = Math.max(11, 22 * cam.s / 2);
          ctx.beginPath();
          ctx.arc(x, y, r, 0, TAU);
          ctx.fillStyle = 'rgba(9,229,123,0.15)';
          ctx.fill();
          ctx.strokeStyle = GREEN;
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.fillStyle = '#fafafa';
          ctx.font = '700 ' + Math.round(r) + 'px "Sulphur Point", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(nd.label, x, y + 1);
        } else {
          r = (3 + Math.min(nd.deg, 8) * 0.5) * zoom * grow;
          if (grow < 1) {
            ctx.beginPath();
            ctx.arc(x, y, r + (1 - grow) * 16, 0, TAU);
            ctx.strokeStyle = 'rgba(250,250,250,' + (0.5 * (1 - grow)) + ')';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
          ctx.beginPath();
          ctx.arc(x, y, Math.max(0.5, r), 0, TAU);
          ctx.fillStyle = nd.color;
          ctx.fill();
        }
      });
    }

    function frame(now) {
      var t = now - t0;
      // Spawn faster and faster: every ~240 ms at first, ~50 ms by the end.
      // Birth times use the schedule, so a late frame doesn't hatch a burst at once.
      while (t >= nextSpawn && nodes.length < MAX_NODES && t < 14500) {
        spawn(t0 + nextSpawn);
        nextSpawn += 240 - 190 * Math.min(1, t / 13000);
      }
      tick();
      tick();
      updateCamera();
      draw(now);
      raf = requestAnimationFrame(frame);
    }

    return {
      start: function () {
        ctx = fitCanvas(canvas, W, H);
        t0 = performance.now();
        reset(t0);
        raf = requestAnimationFrame(frame);
      },
      stop: function () {
        cancelAnimationFrame(raf);
        raf = 0;
      },
      resize: function () {
        ctx = fitCanvas(canvas, W, H);
      }
    };
  }

  // ---------------------------------------------------------------------------
  var scenes = {};
  var current = null;

  function show(slide) {
    if (current) current.stop();
    current = (slide && scenes[slide.id]) || null;
    if (current) current.start();
  }

  function init() {
    var s9 = document.getElementById('slide-9');
    var s20 = document.getElementById('slide-20');
    if (s9) scenes['slide-9'] = sunWalk(s9);
    if (s20) scenes['slide-20'] = growNetwork(s20);

    Reveal.on('slidechanged', function (e) { show(e.currentSlide); });
    Reveal.on('resize', function () { if (current) current.resize(); });
    show(Reveal.getCurrentSlide());
  }

  function boot() {
    if (Reveal.isReady()) init();
    else Reveal.on('ready', init);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  // Give the title slide a clean URL hash (#/slide-title instead of #/title-slide)
  var ts = document.getElementById('title-slide');
  if (ts) ts.id = 'slide-title';

  // Countdown bar: sits above the RevealJS progress bar, runs right-to-left per slide
  var cdBar = document.createElement('div');
  cdBar.id = 'slide-countdown';
  cdBar.innerHTML = '<div id="slide-countdown-fill"></div>';
  document.querySelector('.reveal').appendChild(cdBar);

  function resetCountdown() {
    var fill = document.getElementById('slide-countdown-fill');
    fill.style.animation = 'none';
    fill.offsetHeight; // force reflow
    fill.style.animation = '';
  }

  Reveal.on('slidechanged', resetCountdown);
  Reveal.on('ready', resetCountdown);
});
</script>
